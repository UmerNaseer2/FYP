# Continuous integration.
#
# Runs the same four commands a developer runs before pushing, in the same
# order, so a green tick here means the branch is in the state the repo expects:
# it lints, it type-checks, its tests pass, and it builds.
#
# The app lives in my-app/, not at the repository root, so every step sets its
# working directory and the npm cache is keyed on my-app/package-lock.json.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets a maintainer re-run the checks from the Actions tab without pushing.
  workflow_dispatch:

# A second push to the same branch cancels the run still going for the first —
# it is testing code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks only read the code, so the run's token may only read it too.
permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-app

    # A throwaway PostgreSQL for the tests that need a real one
    # (tests/org-migration.test.ts and tests/org-data-db.test.ts), which make
    # and drop databases of their own in it. Only the Test step is told where
    # it is. It trusts every connection instead of taking a password: it lives
    # only as long as this job's machine and holds nothing but test rows, and a
    # password would just be one more made-up value in the build log.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: schema_studio_test
        ports:
          - 55432:5432
        # The job's steps start once the database answers, not merely once
        # its container is up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed on.
          node-version: "22"
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file says and fails if package.json and the lock have drifted apart,
      # which is the whole reason to run it on a build machine.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # The service above. The tests that use it skip on a laptop without
          # one; here they fail instead (tests/helpers/test-database.ts).
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/schema_studio_test
          REQUIRE_TEST_DATABASE: "1"

      - name: Build
        run: npm run build
        env:
          # The metadata pool is created when lib/version-db.ts is first
          # imported and refuses to load without a connection string, so the
          # build needs one to exist. Nothing connects during a build — every
          # page that reads the database is force-dynamic — so this points at a
          # database that isn't there on purpose. A real one would be a
          # production credential sitting in a build log.
          DATABASE_URL_A: postgres://ci:ci@127.0.0.1:5432/ci
          NEXTAUTH_SECRET: ci-build-only-not-a-real-secret
