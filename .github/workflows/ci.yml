# Continuous integration. Three jobs, side by side:
#
# - handover builds the app's image and follows deploy/handover/SETUP-GUIDE.md
#   on a fresh Ubuntu with PostgreSQL 16, command by command. When it all
#   works, it offers the image and the kit as one download,
#   "schema-studio-handover", under the run's Artifacts.
# - check runs the same four commands a developer runs before pushing, in the
#   same order, so a green tick means the branch is in the state the repo
#   expects: it lints, it type-checks, its tests pass, and it builds.
# - stack starts the app the way the server runs it, from docker-compose.yml
#   with the sign-in bypass off, then saves a copy of its database with
#   deploy/backup.sh and puts it back. Last, it saves the app's image to a
#   file with deploy/export-image.sh, starts the app again from that file
#   alone, and checks the script refuses an image with the bypass on.
#
# deploy/auto-update.sh deploys a commit to the server only after this whole
# workflow has passed, so a stack that would not start never reaches it.
#
# The app lives in my-app/, not at the repository root, so every step of the
# check job runs there and the npm cache is keyed on my-app/package-lock.json.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets a maintainer re-run the checks from the Actions tab without pushing.
  workflow_dispatch:

# A second push to the same branch cancels the run still going for the first —
# it is testing code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks only read the code, so the run's token may only read it too.
permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-app

    # A throwaway PostgreSQL for the tests that need a real one
    # (tests/org-migration.test.ts and tests/org-data-db.test.ts), which make
    # and drop databases of their own in it. Only the Test step is told where
    # it is. It trusts every connection instead of taking a password: it lives
    # only as long as this job's machine and holds nothing but test rows, and a
    # password would just be one more made-up value in the build log.
    services:
      postgres:
        # PostgreSQL 16, the version the handover kit is made for.
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: schema_studio_test
        ports:
          - 55432:5432
        # The job's steps start once the database answers, not merely once
        # its container is up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed on.
          node-version: "22"
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file says and fails if package.json and the lock have drifted apart,
      # which is the whole reason to run it on a build machine.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # The service above. The tests that use it skip on a laptop without
          # one; here they fail instead (tests/helpers/test-database.ts).
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/schema_studio_test
          REQUIRE_TEST_DATABASE: "1"

      - name: Build
        run: npm run build
        env:
          # The metadata pool is created when lib/db/version-db.ts is first
          # imported and refuses to load without a connection string, so the
          # build needs one to exist. Nothing connects during a build — every
          # page that reads the database is force-dynamic — so this points at a
          # database that isn't there on purpose. A real one would be a
          # production credential sitting in a build log.
          DATABASE_URL_A: postgres://ci:ci@127.0.0.1:5432/ci
          NEXTAUTH_SECRET: ci-build-only-not-a-real-secret

  stack:
    name: Docker stack, backup and restore
    runs-on: ubuntu-latest
    # Building the image takes a few minutes. A container that never turns
    # healthy stops the run here rather than after GitHub's six hours.
    timeout-minutes: 30

    # No working directory: docker-compose.yml is at the repository root.
    steps:
      - uses: actions/checkout@v4

      # Fresh secrets for this run only, made the way deploy/README.md (step 4)
      # makes the server's, so none is written in the repo or in the log.
      # The made-up AZURE_AD_ values turn Microsoft sign-in on, as on the
      # server. Nothing in this job reaches Microsoft.
      #
      # `sql` runs the SQL it reads in the stack's database and prints bare
      # values. The later steps use it to look at the data.
      - name: Write .env and a SQL helper
        run: |
          cat > .env <<EOF
          COMPOSE_PROJECT_NAME=schema-studio
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          NEXTAUTH_SECRET=$(openssl rand -hex 32)
          APP_ENCRYPTION_KEY=$(openssl rand -hex 32)
          AZURE_AD_CLIENT_ID=00000000-0000-0000-0000-000000000001
          AZURE_AD_CLIENT_SECRET=$(openssl rand -hex 20)
          AZURE_AD_TENANT_ID=00000000-0000-0000-0000-000000000002
          EOF
          chmod 600 .env
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/sql" <<'SH'
          #!/bin/sh
          exec docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -A -t -v ON_ERROR_STOP=1'
          SH
          chmod +x "$RUNNER_TEMP/bin/sql"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Builds the app's image from my-app/Dockerfile and starts it beside its
      # database. --wait returns once both report healthy, which for the app
      # means its sign-in page answers.
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: The sign-in page answers
        run: curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:3000/login

      # Inside its container the app sees only its own 0.0.0.0, so the
      # address Microsoft sends people back to comes from AUTH_URL, which
      # compose sets to http://localhost:3000. A signed-out visitor goes to
      # the sign-in page at that address too.
      - name: Sign-in uses the localhost address
        run: |
          providers="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/api/auth/providers)"
          echo "$providers"
          echo "$providers" | grep -qF '"callbackUrl":"http://localhost:3000/api/auth/callback/microsoft-entra-id"'
          to="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{redirect_url}' http://127.0.0.1:3000/admin)"
          echo "/admin sends a signed-out visitor to $to"
          [ "$to" = "http://localhost:3000/login?callbackUrl=%2Fadmin" ]

      # The drift scheduler's first round, straight after start-up, makes the
      # app's tables. Wait for them, so the copy below holds a real database.
      - name: The app made its tables
        run: |
          for try in $(seq 1 30); do
            tables="$(echo "select count(*) from information_schema.tables where table_schema = 'public'" | sql)"
            [ "$tables" -gt 0 ] && break
            sleep 2
          done
          echo "The app's database has $tables tables."
          [ "$tables" -gt 0 ]

      # A row written just before the copy. The restore must bring it back.
      - name: Save a copy with deploy/backup.sh
        run: |
          echo "create table ci_check (note text); insert into ci_check values ('in the copy');" | sql
          ./deploy/backup.sh
          ls -l backups
          file="$(ls -1t backups/*.dump | head -n 1)"
          docker compose exec -T db pg_restore --list < "$file" | head
          # Only the account that made them may read the copies.
          [ "$(stat -c %a backups)" = 700 ]
          [ "$(stat -c %a "$file")" = 600 ]

      - name: Change the data after the copy
        run: echo "delete from ci_check; insert into ci_check values ('after the copy');" | sql

      # The steps written at the top of deploy/backup.sh, on the newest copy.
      - name: Put the copy back
        run: |
          file="$(ls -1t backups/*.dump | head -n 1)"
          docker compose stop app
          docker compose exec -T db sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --no-owner --single-transaction' < "$file"
          docker compose start app

      - name: The data is back as it was
        run: |
          note="$(echo "select string_agg(note, ', ') from ci_check" | sql)"
          echo "ci_check holds: $note"
          [ "$note" = "in the copy" ]

      - name: The app is healthy again
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:3000/login

      # deploy/export-image.sh saves the running app's image as one file, the
      # way the server hands it over (deploy/CONTAINER-IMAGE.md).
      - name: Save the app's image with deploy/export-image.sh
        run: |
          ./deploy/export-image.sh
          ls -l images
          # It let go of the lock it held while saving.
          [ ! -d .deploy.lock ]
          cd images
          sha256sum -c ./*.sha256

      # The file alone is enough: with the image deleted, the app comes back
      # from the file and still finds its data, which lives in its own volume.
      - name: The saved image runs on its own
        run: |
          tag="schema-studio-app:$(git rev-parse --short=12 HEAD)"
          docker compose rm --stop --force app
          docker image rm schema-studio-app
          for name in schema-studio-app "$tag"; do
            if docker image inspect "$name" > /dev/null 2>&1; then
              echo "$name is still here."
              exit 1
            fi
          done
          docker load -i images/schema-studio-app-*.tar.gz
          docker tag "$tag" schema-studio-app
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:3000/login
          [ "$(docker image inspect -f '{{index .Config.Labels "org.schema-studio.sign-in-bypass"}}' schema-studio-app)" = false ]
          [ "$(docker image inspect -f '{{.Config.User}}' schema-studio-app)" = nextjs ]
          note="$(echo "select string_agg(note, ', ') from ci_check" | sql)"
          echo "ci_check holds: $note"
          [ "$note" = "in the copy" ]

      # Images that differ only in their label stand in for one built with
      # the bypass on and one built before the label existed. Each must be
      # refused, leaving no file behind and the lock free.
      - name: The script refuses an image with the bypass on
        run: |
          tag="schema-studio-app:$(git rev-parse --short=12 HEAD)"
          refused() {
            printf 'FROM %s\nLABEL org.schema-studio.sign-in-bypass="%s"\n' "$tag" "$1" | docker build --quiet --tag schema-studio-app -
            docker compose up -d --no-build --no-deps --force-recreate app
            if out="$(./deploy/export-image.sh 2>&1)"; then
              echo "It saved an image labelled '$1'."
              return 1
            fi
            echo "$out"
            echo "$out" | grep -q "$2"
            [ ! -d .deploy.lock ]
          }
          refused true "set to 'true'"
          refused "" "built before"
          [ "$(ls -1 images | wc -l)" -eq 2 ]
          docker tag "$tag" schema-studio-app
          docker compose up -d --no-build --no-deps --force-recreate --wait --wait-timeout 180 app

      - name: Show the containers and their logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

  handover:
    name: Handover kit on Ubuntu with PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # Every step below is a step of deploy/handover/SETUP-GUIDE.md, run with
    # the guide's own commands where it can be, so a guide that no longer works
    # turns this job red. The guide's step 6 (the Microsoft registration) is
    # done by hand, so made-up values stand in for it.
    steps:
      - uses: actions/checkout@v4

      # The image the download carries, under both of its names: "handover",
      # which docker-compose.yml runs, and the commit it was built from.
      - name: Build the image
        run: |
          echo "VERSION=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          docker build --tag schema-studio-app:handover --tag "schema-studio-app:${GITHUB_SHA::12}" my-app

      # sql/02 is made from the image. A change to the app's tables without a
      # new sql/02 committed stops the run here.
      - name: sql/02 matches the app's tables
        run: |
          bash deploy/handover/make-sql.sh schema-studio-app:handover
          git diff --exit-code -- deploy/handover/sql/02-schema-studio-tables.sql

      # What the download holds: the image as one file, its checksum, and the
      # kit folder (this guide, the compose file, the SQL, the settings
      # template).
      - name: Pack the download
        run: |
          mkdir -p "$RUNNER_TEMP/download/kit"
          cp -r deploy/handover/. "$RUNNER_TEMP/download/kit/"
          cd "$RUNNER_TEMP/download"
          docker save schema-studio-app:handover "schema-studio-app:$VERSION" | gzip > "schema-studio-app-$VERSION.tar.gz"
          sha256sum "schema-studio-app-$VERSION.tar.gz" > "schema-studio-app-$VERSION.tar.gz.sha256"
          ls -lR

      - name: "Guide step 1: Docker and PostgreSQL 16"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16
          sudo service postgresql start
          pg_lsclusters
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker info --format '{{.OperatingSystem}}'
          sudo -u postgres psql -tAc 'SHOW server_version' | grep '^16'

      # From the download alone: the images built above are deleted first.
      - name: "Guide step 2: the files in place and the image loaded"
        run: |
          docker image rm schema-studio-app:handover "schema-studio-app:$VERSION"
          cd "$RUNNER_TEMP/download"
          sha256sum -c schema-studio-app-*.tar.gz.sha256
          sudo install -d -m 700 -o "$USER" -g "$USER" /opt/schema-studio
          cp -r kit/. /opt/schema-studio/
          docker load -i schema-studio-app-*.tar.gz
          docker image ls schema-studio-app
          [ "$(docker image inspect -f '{{.Id}}' schema-studio-app:handover)" = "$(docker image inspect -f '{{.Id}}' "schema-studio-app:$VERSION")" ]
          [ "$(stat -c %a /opt/schema-studio)" = 700 ]

      # The guide keeps the password in one terminal for steps 3 to 5. Here
      # each step is a new shell, so it travels in the job's environment,
      # masked in the log.
      - name: "Guide step 3: the database and its login"
        working-directory: /opt/schema-studio
        run: |
          export SS_DB_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SS_DB_PASSWORD"
          echo "SS_DB_PASSWORD=$SS_DB_PASSWORD" >> "$GITHUB_ENV"
          sudo --preserve-env=SS_DB_PASSWORD -u postgres psql -v ON_ERROR_STOP=1 -f - < sql/01-database-and-login.sql
          [ "$(PGPASSWORD="$SS_DB_PASSWORD" psql -h 127.0.0.1 -U schema_studio -d schema_studio -tAc 'SELECT current_user')" = schema_studio ]
          # Another ordinary login cannot even connect to the app's database.
          sudo -u postgres psql -qc "CREATE ROLE someone_else LOGIN PASSWORD 'someone-else-password'"
          if PGPASSWORD=someone-else-password psql -h 127.0.0.1 -U someone_else -d schema_studio -c 'SELECT 1' 2> "$RUNNER_TEMP/refused"; then
            echo "someone_else could connect to schema_studio."
            exit 1
          fi
          cat "$RUNNER_TEMP/refused"
          grep -q 'CONNECT privilege' "$RUNNER_TEMP/refused"

      - name: "Guide step 4: the tables"
        working-directory: /opt/schema-studio
        run: |
          PGPASSWORD="$SS_DB_PASSWORD" psql -h 127.0.0.1 -U schema_studio -d schema_studio -v ON_ERROR_STOP=1 -q -f sql/02-schema-studio-tables.sql
          PGPASSWORD="$SS_DB_PASSWORD" psql -h 127.0.0.1 -U schema_studio -d schema_studio -c '\dt'
          [ "$(sudo -u postgres psql -d schema_studio -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner <> 'schema_studio'")" = 0 ]

      - name: "Guide step 5: the settings file"
        working-directory: /opt/schema-studio
        run: |
          cp example.env .env && chmod 600 .env
          sed -i "s|^DATABASE_URL_A=.*|DATABASE_URL_A=postgres://schema_studio:${SS_DB_PASSWORD}@127.0.0.1:5432/schema_studio|" .env
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^APP_ENCRYPTION_KEY=.*|APP_ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env
          [ "$(grep -cE '^(DATABASE_URL_A|NEXTAUTH_SECRET|APP_ENCRYPTION_KEY)=.+' .env)" = 3 ]
          [ "$(stat -c %a .env)" = 600 ]
          # Before step 6, Compose refuses to start and names what is missing.
          if docker compose config > /dev/null 2> "$RUNNER_TEMP/missing"; then
            echo "Compose started without the Microsoft values."
            exit 1
          fi
          cat "$RUNNER_TEMP/missing"
          grep -q 'AZURE_AD_' "$RUNNER_TEMP/missing"

      # Stand-ins for the guide's step 6. "common" is a real Microsoft sign-in
      # address, so the sign-in check below gets a real answer from Microsoft;
      # the client ID and secret are made up, and nobody signs in.
      - name: "Guide step 6: Microsoft values (made up)"
        working-directory: /opt/schema-studio
        run: |
          sed -i "s|^AZURE_AD_CLIENT_ID=.*|AZURE_AD_CLIENT_ID=00000000-0000-0000-0000-000000000001|" .env
          sed -i "s|^AZURE_AD_CLIENT_SECRET=.*|AZURE_AD_CLIENT_SECRET=$(openssl rand -hex 20)|" .env
          sed -i "s|^AZURE_AD_TENANT_ID=.*|AZURE_AD_TENANT_ID=common|" .env

      - name: "Guide step 7: start"
        working-directory: /opt/schema-studio
        run: |
          timeout 300 docker compose up -d --wait
          docker compose ps
          [ "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = 200 ]

      # Pressing "Continue with Microsoft" sends the browser to Microsoft,
      # which is to send it back to this machine's localhost address.
      - name: Sign-in goes to Microsoft and back to localhost
        run: |
          providers="$(curl -fsS http://localhost:3000/api/auth/providers)"
          echo "$providers"
          echo "$providers" | grep -qF '"callbackUrl":"http://localhost:3000/api/auth/callback/microsoft-entra-id"'
          jar="$RUNNER_TEMP/cookies"
          csrf="$(curl -fsS -c "$jar" http://localhost:3000/api/auth/csrf | jq -r .csrfToken)"
          to="$(curl -sS -b "$jar" -o /dev/null -w '%{redirect_url}' --data-urlencode "csrfToken=$csrf" --data-urlencode "callbackUrl=http://localhost:3000/" http://localhost:3000/api/auth/signin/microsoft-entra-id)"
          echo "Sign-in sends the browser to: ${to%%\?*}"
          case "$to" in
            https://login.microsoftonline.com/common/oauth2/v2.0/authorize\?*) ;;
            *) echo "$to"; exit 1 ;;
          esac
          echo "$to" | grep -qF 'redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fapi%2Fauth%2Fcallback%2Fmicrosoft-entra-id'

      # The first start adds the default organization and its roles, and
      # leaves the structure exactly as sql/02 made it.
      - name: The first start kept sql/02's tables
        working-directory: /opt/schema-studio
        run: |
          # A failure here is also written as an annotation, which anyone can
          # read on the run's summary page.
          annotate() {
            echo "::error title=$1::$(head -c 4000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          }
          done_sql="SELECT pg_try_advisory_xact_lock(7365786101) AND EXISTS (SELECT 1 FROM organizations o JOIN roles r ON r.org_id = o.id WHERE o.is_default AND r.name = 'admin')"
          for _ in $(seq 120); do
            [ "$(sudo -u postgres psql -d schema_studio -tAc "$done_sql" 2>&1)" = t ] && break
            sleep 1
          done
          if [ "$(sudo -u postgres psql -d schema_studio -tAc "$done_sql" 2>&1)" != t ]; then
            { sudo -u postgres psql -d schema_studio -tAc "$done_sql" 2>&1
              docker compose logs --no-color --tail 40 app; } | annotate "The first start did not finish"
            exit 1
          fi
          sudo -u postgres psql -d schema_studio -c 'SELECT slug, name, is_default FROM organizations'
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_dump -d schema_studio \
            --schema-only --no-owner --no-privileges --no-comments --quote-all-identifiers \
            | grep -vE '^\\(un)?restrict |^-- Dumped (from database|by pg_dump) version ' > "$RUNNER_TEMP/after.sql"
          if ! diff <(sed -n '/^-- PostgreSQL database dump$/,$p' sql/02-schema-studio-tables.sql) \
                    <(sed -n '/^-- PostgreSQL database dump$/,$p' "$RUNNER_TEMP/after.sql") > "$RUNNER_TEMP/tables.diff"; then
            annotate "The first start changed sql/02's tables" < "$RUNNER_TEMP/tables.diff"
            exit 1
          fi
          if docker compose logs app | grep -q 'tick failed'; then
            docker compose logs --no-color app | grep -A5 'tick failed' | annotate "The app logged tick failed"
            exit 1
          fi

      # What the guide's "Who can read what" says about the container.
      - name: The container is confined as the guide says
        working-directory: /opt/schema-studio
        run: |
          id="$(docker compose ps -q app)"
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true ]
          [ "$(docker inspect -f '{{.Config.User}}' "$id")" = 1001:1001 ]
          [ "$(docker inspect -f '{{.HostConfig.CapDrop}}' "$id")" = '[ALL]' ]
          [ "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$id")" = host ]
          ! docker inspect -f '{{range .Mounts}}{{.Type}} {{end}}' "$id" | grep -qE 'bind|volume'
          [ "$(docker compose exec -T app id -u)" = 1001 ]
          if docker compose exec -T app sh -c 'echo x > /app/probe' 2> /dev/null; then
            echo "The app could write to its own files."
            exit 1
          fi
          docker compose exec -T app sh -c 'echo x > /tmp/probe && rm /tmp/probe'

      # The guide's day-to-day table: stop, start, and a restart with the
      # tables already there.
      - name: Stop and start again
        working-directory: /opt/schema-studio
        run: |
          docker compose down
          timeout 300 docker compose up -d --wait
          [ "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = 200 ]
          sleep 10
          ! docker compose logs app | grep 'tick failed'

      - name: Offer the image and the kit as a download
        uses: actions/upload-artifact@v4
        with:
          name: schema-studio-handover
          path: ${{ runner.temp }}/download/
          # The image is gzipped already.
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Show the app's logs
        if: failure()
        run: |
          cd /opt/schema-studio 2> /dev/null || exit 0
          docker compose ps --all || true
          docker compose logs --no-color --tail 300 || true
          # The last lines again as an annotation, readable on the summary page.
          echo "::warning title=The app's last log lines::$(docker compose logs --no-color --tail 50 2>&1 | head -c 4000 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
