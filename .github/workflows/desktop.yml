# Builds and tests the desktop app in desktop/, the .deb that installs
# Schema Studio on Ubuntu.
#
# Four jobs. build waits for test, and install and apparmor both wait for
# build:
#
# 1. test runs the desktop app's unit tests.
# 2. build makes the .deb on an amd64 machine and on an arm64 one, checks
#    what went into it, and keeps each .deb as an artifact of the run, which
#    can be downloaded from the run's page.
# 3. install puts each .deb on a fresh Ubuntu 20.04, 22.04, 24.04 and 26.04,
#    and on the newest release (Docker's rolling image), with nothing else
#    installed first. It checks that every library the app loads is there,
#    runs the installed app's self-test, checks its entry in the app grid
#    and removes it again.
# 4. apparmor installs each .deb on the runner's own Ubuntu 24.04. There, as
#    on an Ubuntu desktop from 24.04 on, the window's sandbox only starts
#    under the AppArmor profile that the .deb brings, so this shows that the
#    profile works. The containers in job 3 cannot load AppArmor profiles.
#
# It runs only when desktop/, my-app/ (the desktop app is built from it) or
# this file changes. The server updater, deploy/auto-update.sh, goes by the
# CI workflow alone, so a desktop build never holds a server deploy back.
#
# Microsoft sign-in needs the app registration's two IDs. They are public
# IDs, not secrets, and come from the repository variables AZURE_AD_CLIENT_ID
# and AZURE_AD_TENANT_ID (desktop/README.md says how to add them). Without
# them the .deb is still built and tested, and its sign-in says that it is
# not set up.
name: Desktop

on:
  push:
    branches: ["**"]
    paths: ["desktop/**", "my-app/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "my-app/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # npm ci would otherwise download an Electron for the runner itself. The
  # tests do not use it, and electron-builder downloads the Linux Electron
  # it packs on its own.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  build:
    name: Build the .deb (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # The build installs my-app's packages too, to build its server.
          cache-dependency-path: |
            desktop/package-lock.json
            my-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build the .deb
        run: npm run dist:deb
        env:
          AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          AZURE_AD_TENANT_ID: ${{ vars.AZURE_AD_TENANT_ID }}
      - name: Check what the package holds
        shell: bash
        run: |
          # app.asar holds the app's own code. Its listing starts each path
          # with a slash, which is taken off here.
          asar_file="$(ls dist/linux*-unpacked/resources/app.asar)"
          npx --no asar list "$asar_file" | sed 's#^/##' > "$RUNNER_TEMP/asar.txt"
          for file in package.json out/build-config.json out/main/main.js out/preload/app-preload.js out/preload/settings-preload.js renderer/splash.html renderer/settings.html renderer/app.css assets/icon.png node_modules/pg/package.json node_modules/@azure/msal-node/package.json; do
            if ! grep -qxF "$file" "$RUNNER_TEMP/asar.txt"; then
              echo "app.asar is missing $file."
              exit 1
            fi
          done
          # The compiled unit tests are only for npm test.
          if grep -E '^out/test(/|$)' "$RUNNER_TEMP/asar.txt"; then
            echo "app.asar holds the unit tests listed above, which must be left out of the package."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: schema-studio-${{ matrix.arch }}
          path: desktop/dist/*.deb
          if-no-files-found: error

  install:
    name: Install on Ubuntu ${{ matrix.version }} (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: ["20.04", "22.04", "24.04", "26.04", "rolling"]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    # A fresh Ubuntu of that version. It is privileged because Chromium's
    # sandbox makes namespaces that Docker's defaults forbid, and it has more
    # shared memory than Docker's 64 MB, which Chromium and PostgreSQL both
    # use.
    container:
      image: ubuntu:${{ matrix.version }}
      options: --privileged --shm-size=1g
    env:
      # So that installing a package never stops to ask a question.
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schema-studio-${{ matrix.arch }}
          path: deb
      - name: Install it
        run: |
          apt-get update
          # Only what the .deb depends on, and nothing it merely recommends,
          # so that a dependency it forgot to name shows up in the next step.
          apt-get install -y --no-install-recommends ./deb/*.deb
      - name: Check its libraries
        run: |
          for program in "/opt/Schema Studio/schema-studio" "/opt/Schema Studio/resources/postgres/bin/postgres" "/opt/Schema Studio/resources/postgres/bin/initdb"; do
            if [ ! -x "$program" ]; then
              echo "$program is not in the package."
              exit 1
            fi
            # ldd lists the libraries a program loads, with "not found" after
            # each one that is not installed. Only its output is checked, not
            # its exit code.
            missing="$(ldd "$program" 2>&1 | grep "not found" || true)"
            if [ -n "$missing" ]; then
              echo "$missing"
              echo "$program needs the libraries above, and the .deb's dependencies do not bring them in."
              exit 1
            fi
          done
      - name: Allow the sandbox's namespaces
        run: |
          # The runner's Ubuntu 24.04 kernel lets an ordinary user make the
          # namespaces Chromium's sandbox needs only under an AppArmor
          # profile. The .deb brings one, which the apparmor job tests, but a
          # container cannot load it. This changes the runner's own setting,
          # and the runner is thrown away after the job.
          setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$setting" ] && [ "$(cat "$setting")" = 1 ]; then
            echo 0 > "$setting"
          fi
      - name: Install the test tools
        run: apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils
      - name: Run the self-test
        run: |
          # Only someone signed in to GitHub can read a job's log, but anyone
          # can read the annotations on a run's page. So if this step fails
          # for any reason, what explains it goes in annotations. GitHub
          # reads a % or a line break in one as part of its own format, so
          # those are written its way.
          annotate() {
            local text
            text="$(tail -c 4000 "$3" 2>&1 || true)"
            text=${text//'%'/'%25'}
            text=${text//$'\r'/'%0D'}
            text=${text//$'\n'/'%0A'}
            echo "::$1 title=$2::$text"
          }
          explain() {
            local status=$?
            if [ "$status" -eq 0 ]; then
              return
            fi
            {
              echo "The step stopped with exit code $status."
              echo "PATH is $PATH"
              getent passwd tester || true
              ls -l /usr/bin/schema-studio /etc/alternatives/schema-studio "/opt/Schema Studio/schema-studio" || true
              for tool in useradd runuser xvfb-run Xvfb xauth mcookie getopt; do
                echo "$tool is $(command -v "$tool" || echo missing)"
              done
            } > /tmp/facts.txt 2>&1
            annotate error "The self-test step failed" /tmp/facts.txt
            if [ -f /tmp/self-test.txt ]; then
              annotate error "What the self-test printed" /tmp/self-test.txt
            fi
            if [ -f /tmp/xvfb-errors.txt ]; then
              annotate error "What the screen server printed" /tmp/xvfb-errors.txt
            fi
          }
          trap explain EXIT

          # Chromium and PostgreSQL both refuse to run as root, so the test
          # runs as an ordinary user, and xvfb-run gives it a screen.
          useradd --create-home tester

          # For one run only, the test also runs as it did at first, through
          # a login shell, to find out why that failed on Ubuntu 24.04 with
          # exit code 127. Its result is noted and does not decide the job.
          login_status=0
          runuser -l tester -c "xvfb-run --auto-servernum schema-studio --self-test" > /tmp/login-shell.txt 2>&1 || login_status=$?
          if [ "$login_status" -ne 0 ]; then
            runuser -l tester -c 'echo "PATH is $PATH"; echo "xvfb-run is $(command -v xvfb-run)"; echo "schema-studio is $(command -v schema-studio)"' >> /tmp/login-shell.txt 2>&1 || true
            annotate warning "Through a login shell the self-test exited with $login_status" /tmp/login-shell.txt
          fi

          # The test runs in the user's home folder, with a plain environment
          # of its own and the PATH an ordinary user has, so no profile
          # script of any Ubuntu version plays a part in it.
          cd /home/tester
          runuser -u tester -- env -i HOME=/home/tester USER=tester LOGNAME=tester PATH=/usr/local/bin:/usr/bin:/bin \
            xvfb-run --auto-servernum --error-file=/tmp/xvfb-errors.txt schema-studio --self-test 2>&1 | tee /tmp/self-test.txt
      - name: Check the app grid entry
        run: |
          entry=/usr/share/applications/io.github.umernaseer2.SchemaStudio.desktop
          desktop-file-validate "$entry"
          # Ubuntu's dock uses this line to match the window to this entry
          # and its icon.
          if ! grep -qx "StartupWMClass=io.github.umernaseer2.SchemaStudio" "$entry"; then
            echo "$entry does not name the window's class, so the dock would show the window without its icon."
            exit 1
          fi
          icon="$(sed -n 's/^Icon=//p' "$entry")"
          if ! ls /usr/share/icons/hicolor/*/apps/"$icon".png; then
            echo "There is no $icon picture in /usr/share/icons/hicolor, so the app grid would show a blank icon."
            exit 1
          fi
      - name: Remove it
        run: |
          apt-get remove -y schema-studio
          for leftover in /usr/bin/schema-studio "/opt/Schema Studio/schema-studio" /usr/share/applications/io.github.umernaseer2.SchemaStudio.desktop; do
            if [ -e "$leftover" ] || [ -L "$leftover" ]; then
              echo "Removing the package left $leftover behind."
              exit 1
            fi
          done

  apparmor:
    name: Run under AppArmor on Ubuntu 24.04 (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schema-studio-${{ matrix.arch }}
          path: deb
      - name: Restrict namespaces as Ubuntu does
        run: |
          # From 24.04 on, Ubuntu lets an ordinary user make the namespaces
          # Chromium's sandbox needs only under an AppArmor profile that
          # allows it. This turns that rule on, as it is on an Ubuntu
          # desktop, in case the runner has it off.
          setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$setting" ]; then
            echo 1 | sudo tee "$setting" > /dev/null
          else
            echo "::warning::This runner's kernel does not restrict namespaces, so this job does not show that the AppArmor profile works."
          fi
      - name: Install it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./deb/*.deb xvfb xauth
      - name: Check that its AppArmor profile is loaded
        run: |
          if ! sudo grep -q "^schema-studio (" /sys/kernel/security/apparmor/profiles; then
            echo "Installing the .deb did not load its AppArmor profile, so its window could not start on Ubuntu 24.04 and newer."
            exit 1
          fi
      - name: Run the self-test as an ordinary user
        run: xvfb-run --auto-servernum schema-studio --self-test
      - name: Remove it
        run: |
          sudo apt-get remove -y schema-studio
          if [ -e /etc/apparmor.d/schema-studio ] || sudo grep -q "^schema-studio (" /sys/kernel/security/apparmor/profiles; then
            echo "Removing the package left its AppArmor profile behind."
            exit 1
          fi
