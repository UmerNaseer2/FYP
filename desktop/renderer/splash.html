<!doctype html>
<!--
  The splash: what the main window shows while Schema Studio starts, and
  while a backup is restored. src/renderer/splash.ts fills it in, and app.css
  gives each step its look and plays the short logo reveal: the mark is drawn
  here, so that its two squares can take the theme's colours and move.
  The page is served with a strict security policy (src/main/protocol.ts),
  so it has no inline script or style.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Schema Studio</title>
    <link rel="stylesheet" href="app.css">
    <script src="splash.js" defer></script>
  </head>
  <body class="splash">
    <main class="splash-main">
      <header class="brand">
        <svg class="brand-mark" viewBox="0 0 30 30" width="64" height="64" aria-hidden="true">
          <defs>
            <clipPath id="mark-overlap"><rect x="2" y="2" width="18" height="18" rx="6"/></clipPath>
          </defs>
          <rect class="mark-a" x="2" y="2" width="18" height="18" rx="6"/>
          <rect class="mark-b" x="10" y="10" width="18" height="18" rx="6"/>
          <rect class="mark-cut" x="10" y="10" width="18" height="18" rx="6" clip-path="url(#mark-overlap)"/>
        </svg>
        <h1 class="brand-name">Schema Studio</h1>
      </header>
      <div class="panel">
        <div id="restoring" class="restoring" hidden>
          <p id="restoring-step" class="step" data-state="current"><span class="step-mark" aria-hidden="true"></span>Restoring the backup</p>
          <p id="restoring-note" class="hint restoring-note">Schema Studio starts again by itself when it is done.</p>
        </div>
        <ol id="steps" class="steps" aria-label="Starting Schema Studio">
          <li class="step" data-step="secrets" data-state="current" aria-current="step"><span class="step-mark" aria-hidden="true"></span>Unlocking your keys</li>
          <li class="step" data-step="database" data-state="pending"><span class="step-mark" aria-hidden="true"></span>Starting the database</li>
          <li class="step" data-step="server" data-state="pending"><span class="step-mark" aria-hidden="true"></span>Starting Schema Studio</li>
          <li class="step" data-step="sign-in" data-state="pending"><span class="step-mark" aria-hidden="true"></span>Checking your sign-in</li>
        </ol>
        <section id="failure" class="failure" aria-labelledby="failure-title" hidden>
          <h2 id="failure-title" class="failure-title"></h2>
          <p id="failure-message" class="failure-message"></p>
          <div id="failure-actions" class="actions">
            <button id="retry" class="button button-primary" type="button">Try again</button>
            <button id="open-logs" class="button" type="button">Open logs</button>
            <button id="copy-details" class="button" type="button">Copy details</button>
          </div>
          <p id="copy-note" class="note" role="status"></p>
        </section>
      </div>
      <p id="live" class="visually-hidden" role="status"></p>
    </main>
  </body>
</html>
