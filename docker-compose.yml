# Schema Studio and its metadata database, in two containers.
#
#   docker compose up --build
#   open http://localhost:3000
#
# Sign-in is on: the app asks everyone for a Microsoft (or GitHub) account, so
# it needs NEXTAUTH_SECRET and the AZURE_AD_* keys under `app` below, in a
# .env file beside this one (deploy/README.md, step 4). For a quick look on
# your own machine without them, turn the test bypass on for that build:
#
#   NEXT_PUBLIC_AUTH_BYPASS=true docker compose up --build
#
# `db` here is the app's OWN store — the saved connections, the lineage and the
# drift history. It is not a database you compare; those are reached over the
# network from whatever you register on the Connections screen, and they can be
# anywhere, including on the host (use host.docker.internal as the hostname).

# Docker keeps what each container prints in a file on the server. Without a
# cap that file grows for as long as the container runs. This keeps three
# files of 10 MB at most per container, dropping the oldest first.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published so you can point psql at it while the stack is running, on
      # this machine only (127.0.0.1): the password above is the example one,
      # and this database holds every saved connection. To reach it from other
      # machines, change POSTGRES_PASSWORD first, then set POSTGRES_PORT=5433.
      # Drop these lines if you would rather it stayed inside the compose
      # network.
      - "${POSTGRES_PORT:-127.0.0.1:5433}:5432"
    healthcheck:
      # The app creates its tables on first use, so it must not start until the
      # server is actually accepting connections — not merely running.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio} -d ${POSTGRES_DB:-studio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Come back by itself when Docker starts, after a reboot say, like the app
    # below. Without this the app would come back alone, unable to load or
    # save anything.
    restart: unless-stopped
    # no-new-privileges: nothing in the container can gain more rights than it
    # started with, say through a setuid program. The database keeps Docker's
    # usual capabilities, because its start-up script needs them to set up the
    # data folder and switch to the postgres user.
    security_opt:
      - no-new-privileges:true
    # Caps on memory and on processes, so a runaway query hits this
    # container's limit, not the whole server. To raise the memory cap, set
    # DB_MEMORY_LIMIT in .env (2g, say) and run `docker compose up -d`.
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    pids_limit: 200
    logging: *logging

  app:
    build:
      context: ./my-app
      args:
        # The sign-in bypass, baked into the browser bundle at build time, so
        # changing it needs a rebuild (`docker compose up -d --build`), not
        # just a restart. Off by default, like the Dockerfile's own default:
        # everyone signs in. Set it to true only for a quick look on your own
        # machine, never on a server other people can reach, because with it
        # on anyone who can open the page is let in as an admin.
        NEXT_PUBLIC_AUTH_BYPASS: ${NEXT_PUBLIC_AUTH_BYPASS:-false}
    environment:
      # The container talks to the database over the compose network, so the
      # host is the service name and the port is the container's own 5432 —
      # not whatever it is published as on your machine. `sslmode=disable`
      # because the postgres image serves no SSL, and the app only turns SSL
      # off by itself for localhost (see lib/db/metadata-ssl.ts).
      DATABASE_URL_A: postgres://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@db:5432/${POSTGRES_DB:-studio}?sslmode=disable
      # Signs the session cookie. Set your own, `openssl rand -hex 32`: with
      # none the app will not sign anyone in. There is no default on purpose.
      # One written here would be the same for every copy, so anyone could
      # sign a cookie with it, and the app refuses the one this file used to
      # have.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      # Optional. Set to a 32-byte base64 or hex key (`openssl rand -hex 32`)
      # to encrypt stored connection passwords and each organization's GitHub
      # access token at rest. Without it the key is derived from
      # NEXTAUTH_SECRET. With neither, connection passwords are stored as
      # typed (the Connections screen says so) and no GitHub token is saved.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Optional. The default organization's GitHub script registry, for the
      # Script Editor's push and pull, until an admin saves a repository and
      # token for it on the Admin screen, under GitHub. Other organizations
      # save their own there and never use these. The rest of the app works
      # without them.
      GITHUB_PAT: ${GITHUB_PAT:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      # Microsoft Entra ID sign-in. All three come from the app registration
      # in the Azure portal, and the registration needs the redirect URI
      # http://localhost:3000/api/auth/callback/microsoft-entra-id under its
      # Web platform (or the https one of a public link). See
      # deploy/README.md, step 4.
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      # "true" only when the registration takes accounts from any directory.
      # Leave it unset for one that takes its own directory only.
      AZURE_AD_ANY_ACCOUNT: ${AZURE_AD_ANY_ACCOUNT:-}
      # The address people open the app at, with no path. Sign-in builds the
      # address Microsoft (or GitHub) sends people back to from it, because
      # inside the container the app sees only 0.0.0.0, never the address
      # typed into the browser. The default suits APP_PORT's default. With
      # another port, or a public https link, set AUTH_URL in .env to match
      # (deploy/README.md, "Before the link is made public").
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Optional. Sign-in with GitHub as well, from a GitHub OAuth app whose
      # callback URL is http://localhost:3000/api/auth/callback/github.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # A container reaching a database on the host machine needs a private
      # address to be allowed. Off by default — see lib/connection-config.ts.
      ALLOW_PRIVATE_DB_HOSTS: ${ALLOW_PRIVATE_DB_HOSTS:-}
      # The app checks the tracked databases for drift on a timer of its own.
      # `off` stops that, for a copy that should not touch any database by
      # itself (a demo, or a second copy of this server).
      DRIFT_SCHEDULER: ${DRIFT_SCHEDULER:-}
      # Optional. AI help: the Compare summary, the migration review, drift
      # explanations, SQL drafts from plain words and the schema chat. It
      # stays off until AI_BASE_URL, AI_API_KEY and a model name are all set,
      # and each organization still starts with it off until its Admin
      # switches it on in Admin, AI. See deploy/README.md, "Optional lines".
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_MODEL_SMART: ${AI_MODEL_SMART:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      AI_PER_MINUTE: ${AI_PER_MINUTE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # This machine only (127.0.0.1) by default. Open it as
      # http://localhost:3000, not 127.0.0.1: Microsoft accepts a plain http
      # sign-in address only for localhost, and it must match the redirect
      # URI exactly. Another port here needs the same port in AUTH_URL above.
      # Other machines need an https link through a proxy, as
      # deploy/README.md describes.
      - "${APP_PORT:-127.0.0.1:3000}:3000"
    restart: unless-stopped
    # The app runs as an ordinary user (see the Dockerfile) on port 3000, so it
    # needs none of the extra rights Docker gives a container by default.
    # cap_drop takes them all away, and no-new-privileges stops it from
    # getting any back.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Caps on memory and on processes, as for db. If the app is ever stopped
    # for running out of memory, set APP_MEMORY_LIMIT in .env (4g, say) and
    # run `docker compose up -d`.
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    pids_limit: 200
    logging: *logging
    # Compose Watch: rebuild the app image and swap the container whenever a
    # source file under my-app/ changes. It is OFF until you ask for it, with
    # `docker compose up --watch`, `docker compose watch`, or `w` in the menu
    # that `docker compose up` shows.
    #
    # `rebuild` rather than `sync` because this container runs a compiled
    # production build (`next build`, standalone). Copying a changed .tsx into
    # it would do nothing; only a fresh build picks it up. So every save costs a
    # rebuild of 30 to 70 seconds. For quick edit-and-look work, `npm run dev`
    # is still faster.
    #
    # Only the app container is rebuilt. The database keeps running
    # and its data (the pgdata volume) is never touched.
    develop:
      watch:
        - action: rebuild
          path: ./my-app
          # Changes here never alter what the running app does, so they should
          # not cost a rebuild. (.dockerignore already keeps node_modules,
          # .next and .env* out; they are listed too so this reads on its own.)
          ignore:
            - node_modules/
            - .next/
            - tests/
            - docs/
            - scripts/
            - README.md

volumes:
  pgdata:
